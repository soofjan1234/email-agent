[project]
name = "email-agent"
version = "0.1.0"
description = "NAS after-sales email agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
