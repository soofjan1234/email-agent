[project]
name = "email-agent"
version = "0.1.0"
description = "NAS after-sales email agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "numpy==2.5.3",
    "python-dotenv==1.2.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "psycopg[binary,pool]==3.3.5",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
